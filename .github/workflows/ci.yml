name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest

      # P16: бенчмарк производительности на моках — стабильность workflow и время обработки
      # без моделей. Падает, если исход хода не совпал с ожидаемым, есть сбои или p95 > 1,5 с.
      - name: Performance benchmark (mock)
        run: python -m perf.run --mode mock --repeats 3 --check --output perf/results/ci-mock.json

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-mock
          path: perf/results/ci-mock.*
