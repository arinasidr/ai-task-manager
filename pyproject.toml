[project]
name = "ai-task-manager"
version = "0.1.0"
description = "Мультиагентная система управления личными задачами на русском языке"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HTTP API и конфигурация
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # база часовых поясов: на Windows без неё ZoneInfo("Europe/Moscow") не работает
    "tzdata>=2024.1",
    "httpx>=0.27",
    # CLI (ходит в HTTP API, не в БД)
    "typer>=0.12",
    # Агентный workflow и работа с локальными LLM (Ollama)
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
]

[project.scripts]
atm = "ai_task_manager.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_task_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
